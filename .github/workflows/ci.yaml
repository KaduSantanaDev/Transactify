name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop

jobs:
  build-docker:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        app: [producer-api, worker]

    name: build-docker (${{ matrix.app }})

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies (root)
        run: npm install

      - name: Build app (${{ matrix.app }})
        run: npm run build ${{ matrix.app }}

      - name: Lint app (${{ matrix.app }})
        run: eslint apps/${{ matrix.app }}/**/*.ts --fix

      - name: Build Docker image (${{ matrix.app }})
        run: docker build -t ${{ matrix.app }}:${{ github.sha }} ./apps/${{ matrix.app }}
